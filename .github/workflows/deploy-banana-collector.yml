name: Deploy Banana Collector to GitHub Pages

# Déploie banana-collector/ à la racine du site Pages, et le tableau de bord
# stock-alerts-app en sous-chemin /stock-alerts/ du même site (aucun réglage
# GitHub supplémentaire requis : la Source Pages est déjà "GitHub Actions").
#
# Étape manuelle à faire UNE FOIS dans GitHub, avant que ce workflow
# puisse publier quoi que ce soit :
#   Settings > Pages > Build and deployment > Source = "GitHub Actions"

on:
  push:
    branches: ["main"]
    paths:
      - "banana-collector/**"
      - "stock-alerts-app/supabase/functions/app/static/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "banana-collector-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stamp cache-busting version into index.html
        run: sed -i "s/__CACHEBUST__/${{ github.sha }}/g" banana-collector/index.html

      - name: Assemble combined Pages site
        run: |
          mkdir -p site
          cp -r banana-collector/. site/
          rm -rf site/node_modules site/.gitignore site/tests
          mkdir -p site/stock-alerts
          cp -r stock-alerts-app/supabase/functions/app/static/. site/stock-alerts/

      - name: Upload combined site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
