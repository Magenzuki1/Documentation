name: Stock Alerts - Verification periodique

# Fait tourner le controleur d'alertes (stock-alerts-app) toutes les
# ~10 minutes, independamment de tout PC/telephone allume : c'est ce qui
# permet de recevoir les notifications meme quand l'application n'est pas
# ouverte. L'etat (abonnements push, reglages, historique) est partage via
# Supabase (secrets SUPABASE_URL / SUPABASE_ANON_KEY ci-dessous).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.repository == 'Magenzuki1/Documentation'
    defaults:
      run:
        working-directory: stock-alerts-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run check cycle
        env:
          SUPABASE_URL: ${{ secrets.STOCK_ALERTS_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STOCK_ALERTS_SUPABASE_ANON_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.STOCK_ALERTS_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.STOCK_ALERTS_VAPID_PRIVATE_KEY }}
          VAPID_CONTACT_EMAIL: ${{ secrets.STOCK_ALERTS_VAPID_CONTACT_EMAIL }}
        run: npm run check
